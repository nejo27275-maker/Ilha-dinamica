name: Compilar APK Ilha Dinâmica

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descarregar repositório
      uses: actions/checkout@v4

    - name: Extrair o ficheiro ZIP
      run: |
        unzip -o IlhaDinamica-8.zip || unzip -o *.zip

    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Dar permissão ao Gradlew
      run: chmod +x gradlew || true

    - name: Compilar APK (Debug)
      run: ./gradlew assembleDebug

    - name: Guardar o APK gerado
      uses: actions/upload-artifact@v4
      with:
        name: IlhaDinamica-v8-APK
        path: app/build/outputs/apk/debug/app-debug.apk
