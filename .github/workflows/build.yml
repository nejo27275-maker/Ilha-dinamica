name: Compilar APK Ilha Dinamica

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descarregar repositório
      uses: actions/checkout@v4

    - name: 1. Ver se o ZIP foi enviado (Listar raiz)
      run: ls -la

    - name: 2. Extrair o ficheiro ZIP
      run: unzip -o *.zip || echo "AVISO: Nenhum ficheiro ZIP encontrado!"

    - name: 3. Diagnosticar e Compilar APK
      run: |
        echo "A procurar o ficheiro gradlew..."
        GRADLEW_PATH=$(find . -name gradlew | head -n 1)
        
        if [ -z "$GRADLEW_PATH" ]; then
          echo "ERRO FATAL: O ficheiro 'gradlew' não existe! O teu ZIP está incompleto ou não foi enviado."
          echo "Aqui está o que o servidor encontrou:"
          ls -laR
          exit 1
        fi
        
        PASTA=$(dirname "$GRADLEW_PATH")
        echo "A entrar na pasta do projeto: $PASTA"
        cd "$PASTA"
        
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: 4. Guardar o APK gerado
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: IlhaDinamica-APK
        path: "**/*.apk"
